project:
  title: "pm25_gap_analysis_presentation"

format:
  revealjs:
    theme: [default, custom.scss]
    transition: fade
    transition-speed: slow
    slide-number: c/t
    show-slide-number: all
    progress: true
    preview-links: auto
    touch: true
    fragments: true
    
    # Layout
    width: 1280
    height: 720
    margin: 0.1
    min-scale: 0.2
    max-scale: 2.0
    
    # Footer
    footer: "Brayden Nilson · NAPS Special Topics · 2026"
    
    # Code blocks
    highlight-style: github-dark
    code-line-numbers: true
    code-copy: true

execute:
  echo: true
  warning: false
  message: false
  cache: true
